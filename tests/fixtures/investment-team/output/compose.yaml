services:
  investment-team-db:
    image: agnohq/pgvector:18
    container_name: investment-team-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:-ai}
      POSTGRES_DB: ${DB_DATABASE:-ai}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - investment-team
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai}"]
      interval: 5s
      retries: 10

  investment-team-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-agno-investment-team}:${IMAGE_TAG:-latest}
    container_name: investment-team-api
    command: uvicorn investment_team.app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - RUNTIME_ENV=dev
      - RESET_ON_STARTUP=1
      - AGNO_DEBUG=True
      - DB_HOST=investment-team-db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ai}
      - DB_PASS=${DB_PASS:-ai}
      - DB_DATABASE=${DB_DATABASE:-ai}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - EXA_API_KEY=${EXA_API_KEY}
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      - RUNTIME_ENV=${RUNTIME_ENV:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
    depends_on:
      investment-team-db:
        condition: service_healthy
    networks:
      - investment-team
    extra_hosts:
      - "host.docker.internal:host-gateway"

  investment-team-ui:
    image: node:20-alpine
    container_name: investment-team-ui
    working_dir: /app/src/frontend
    command: sh -c "npm ci --ignore-scripts && npm run dev -- --host"
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      - VITE_API_HOST=http://investment-team-api:8000
    depends_on:
      - investment-team-api
    networks:
      - investment-team

networks:
  investment-team:

volumes:
  pgdata:
