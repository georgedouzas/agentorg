  overview: {"visualizations": [{"endpoint": "/api/prices/{entity_id}", "linked_to": "positions-grid", "title": "Price History", "type": "candlestick"}], "widgets": [{"endpoint": "/api/widgets/stats", "title": "Fund Summary", "type": "stats-grid"}, {"cols": 2, "endpoint": "/api/widgets/positions", "id": "positions-grid", "title": "Positions", "type": "entity-grid"}, {"endpoint": "/api/widgets/sectors", "title": "Sector Allocation", "type": "bar-table"}]}
  agent_configs: {"committee-chair": {"description": "Makes final investment decisions and capital allocation rulings", "features": ["knowledge_search", "institutional_learning", "agentic_memory", "session_history"], "model": "Gemini Pro", "name": "Committee Chair", "tools": ["get_all_agent_context", "list_agent_reports", "read_agent_report", "list_research_docs", "read_research_doc", "list_memos", "read_memo"]}, "financial-analyst": {"description": "Evaluates company fundamentals, valuation multiples, and balance sheet health", "features": ["knowledge_search", "institutional_learning", "agentic_memory", "session_history"], "model": "Gemini Flash", "name": "Financial Analyst", "tools": ["YFinance", "write_agent_report"]}, "knowledge-agent": {"description": "Retrieves team knowledge and synthesizes analyst reports into the shared knowledge base", "features": ["knowledge_search", "agentic_memory", "session_history"], "model": "Gemini Flash", "name": "Knowledge Agent", "tools": ["list_research_docs", "read_research_doc", "write_research_doc", "list_memos", "read_memo", "search_memos", "list_agent_reports", "read_agent_report"]}, "market-analyst": {"description": "Analyzes macro environment, sector trends, and breaking news", "features": ["knowledge_search", "institutional_learning", "agentic_memory", "session_history"], "model": "Gemini Flash", "name": "Market Analyst", "tools": ["Exa MCP (web search)", "YFinance", "write_agent_report"]}, "memo-writer": {"description": "Synthesizes team analysis into formal investment memos", "features": ["session_history"], "model": "Gemini Flash", "name": "Memo Writer", "tools": ["write_memo", "read_memo", "list_memos"]}, "platform-engineer": {"description": "Manages infra, deployments, and brings the org online", "features": ["session_history"], "model": "Gemini Flash", "name": "Platform Engineer", "tools": ["get_setup_status"]}, "policy-officer": {"description": "Owns the org policy documents", "features": ["session_history"], "model": "Gemini Flash", "name": "Policy Officer", "tools": ["list_policies", "read_policy", "search_policies", "write_policy"]}, "portfolio-agent": {"description": "Tracks portfolio state, positions, and performance reporting", "features": ["session_history"], "model": "Gemini Flash", "name": "Portfolio Agent", "tools": ["get_portfolio_state", "update_portfolio", "YFinance"]}, "research-analyst": {"description": "Writes and maintains company profiles and sector analyses in the research library", "features": ["knowledge_search", "session_history"], "model": "Gemini Flash", "name": "Research Analyst", "tools": ["Exa MCP (web search)", "YFinance", "write_research_doc", "read_research_doc", "list_research_docs"]}, "risk-officer": {"description": "Models downside scenarios, position sizing, and portfolio exposure limits", "features": ["knowledge_search", "institutional_learning", "agentic_memory", "session_history"], "model": "Gemini Flash", "name": "Risk Officer", "tools": ["YFinance", "write_agent_report"]}, "stock-screener": {"description": "Scans the market universe for investment candidates matching the fund mandate", "features": ["knowledge_search", "institutional_learning", "agentic_memory", "session_history"], "model": "Gemini Flash", "name": "Stock Screener", "tools": ["Exa MCP (web search)", "YFinance"]}, "technical-analyst": {"description": "Reads price action, momentum, and entry/exit signals", "features": ["knowledge_search", "institutional_learning", "agentic_memory", "session_history"], "model": "Gemini Flash", "name": "Technical Analyst", "tools": ["YFinance", "write_agent_report"]}}

chat:
  quick_prompts: {"committee-chair": ["Should we invest in NVIDIA? Give me a final decision.", "How should we allocate $3M across AI stocks?"], "financial-analyst": ["Analyze Apple\u0027s fundamentals", "Compare MSFT and GOOGL valuations", "What do analysts think about TSLA?"], "investment-workflow": ["Run the full investment pipeline", "Screen and evaluate stocks for our next allocation", "Run a complete investment review"], "knowledge-agent": ["What does our research say about NVIDIA?", "Pull up our semiconductor sector analysis", "What past memos do we have on file?"], "market-analyst": ["What\u0027s the current market environment for tech stocks?", "Assess the macro outlook for semiconductors", "What\u0027s the latest news on NVIDIA?"], "memo-writer": ["Write an investment memo for NVIDIA", "Draft a portfolio allocation memo for our top 5 picks"], "portfolio-agent": ["Show me the current portfolio report", "What is our total return since inception?", "Which positions are showing the biggest gains?"], "research-analyst": ["Write a company profile for NVIDIA", "Build a sector analysis for AI semiconductors", "Update the research profile for AAPL"], "risk-officer": ["What\u0027s the risk profile of NVDA at a $2M position?", "How much portfolio risk does adding META create?", "What\u0027s the maximum drawdown scenario for TSLA?"], "stock-screener": ["Screen the market for top AI infrastructure plays", "Find 5 high-conviction tech stocks for next quarter", "What semiconductor stocks are showing momentum right now?"], "technical-analyst": ["Is NVDA in a bullish or bearish trend?", "What are the key support levels for AAPL?", "Show me TSLA\u0027s technical indicators"]}

agents:
  stock-screener:
    name: "Stock Screener"
    model: "gemini-3-flash-preview"
    learning: false
    role: "Generate a shortlist of high-conviction tickers that match the fund mandate — not deep analysis of each."
    in_scope: ["Scanning the market for candidate tickers", "Applying mandate filters (large-cap, US-listed, approved sectors)", "Producing ranked shortlists", "Identifying macro themes driving a batch"]
    out_of_scope: [{"refer_to": "Financial Analyst", "topic": "Deep fundamental analysis (earnings, valuation, balance sheet)"}, {"refer_to": "Technical Analyst", "topic": "Price action, charts, momentum"}, {"refer_to": "Market Analyst", "topic": "Macro environment, sector trends, news"}, {"refer_to": "Risk Officer", "topic": "Downside risk, position sizing"}, {"refer_to": "Stock Screener", "topic": "Finding investment candidates / screening"}, {"refer_to": "Research Analyst", "topic": "Writing company/sector research profiles"}, {"refer_to": "Knowledge Agent", "topic": "Past memos or research library"}, {"refer_to": "Committee Chair", "topic": "Final investment decisions"}, {"refer_to": "Portfolio Agent", "topic": "Portfolio status or performance"}]
    workflow: ["Use Exa web search to scan recent themes, analyst upgrades, earnings beats, sector momentum.", "Use YFinance to validate that candidates are publicly traded US-listed equities with sufficient market cap and liquidity.", "Apply mandate filters: large-cap only, approved sectors, no penny stocks/SPACs/ETFs.", "Rank by conviction and present a shortlist.", "Auto-save the report with `write_agent_report`."]
    output_format: {"columns": ["#", "Ticker", "Company", "Sector", "Thesis", "Price", "Market Cap"], "kind": "markdown_table", "trailer": "Then a brief paragraph on the macro theme driving this batch."}
    count_rule: {"default": 5, "rules": [{"count": 1, "phrase": "the best / your top pick / one stock"}, {"count": "N", "phrase": "top N / N stocks / best N"}, {"count": 5, "phrase": "(no number, no singular)"}]}
    save_rule: {"name_pattern": "snake_case slug for the topic — no count, no date (e.g. stock_screen, aapl_fundamentals)", "note": "A re-run on the same topic overwrites the previous save, which is the point of leaving the date out.", "title_pattern": "Title Case with spaces — no count, no date (e.g. Stock Screen, AAPL Fundamentals)", "tool": "write_agent_report"}
    tools: ["tools.reports.write_agent_report"]
  research-analyst:
    name: "Research Analyst"
    model: "gemini-3-flash-preview"
    learning: false
    role: "Build the team\u0027s long-form research library — company profiles and sector analyses other agents and humans can reference."
    in_scope: ["Writing and updating company profiles", "Sector analysis essays", "Deep dives into business model, competitive position, growth drivers", "Indexing research into the team\u0027s RAG-searchable knowledge base"]
    out_of_scope: [{"refer_to": "Financial Analyst", "topic": "Deep fundamental analysis (earnings, valuation, balance sheet)"}, {"refer_to": "Technical Analyst", "topic": "Price action, charts, momentum"}, {"refer_to": "Market Analyst", "topic": "Macro environment, sector trends, news"}, {"refer_to": "Risk Officer", "topic": "Downside risk, position sizing"}, {"refer_to": "Stock Screener", "topic": "Finding investment candidates / screening"}, {"refer_to": "Research Analyst", "topic": "Writing company/sector research profiles"}, {"refer_to": "Knowledge Agent", "topic": "Past memos or research library"}, {"refer_to": "Committee Chair", "topic": "Final investment decisions"}, {"refer_to": "Portfolio Agent", "topic": "Portfolio status or performance"}]
    workflow: ["Search existing research to avoid duplication.", "Use Exa for current company/sector news, filings, analyst notes.", "Use YFinance for fundamentals snapshot.", "Synthesize into a structured profile or sector essay.", "Auto-save with `write_research_doc`."]
    output_format: {"kind": "structured_markdown", "sections": ["Overview", "Business Model", "Competitive Position", "Growth Drivers", "Risks", "Bottom Line"]}
    save_rule: {"name_pattern": "snake_case slug for the topic — no count, no date (e.g. stock_screen, aapl_fundamentals)", "note": "A re-run on the same topic overwrites the previous save, which is the point of leaving the date out.", "title_pattern": "Title Case with spaces — no count, no date (e.g. Stock Screen, AAPL Fundamentals)", "tool": "write_research_doc"}
    tools: ["tools.research.write_research_doc", "tools.research.read_research_doc", "tools.research.list_research_docs", "tools.reports.write_agent_report"]
  market-analyst:
    name: "Market Analyst"
    model: "gemini-3-flash-preview"
    learning: true
    role: "Provide the macro context — what the broader market is doing — for individual investment decisions."
    in_scope: ["Macro environment (rates, inflation, GDP, Fed posture)", "Sector rotation and trends", "Breaking news affecting markets", "Cross-asset signals (yields, USD, oil)"]
    out_of_scope: [{"refer_to": "Financial Analyst", "topic": "Deep fundamental analysis (earnings, valuation, balance sheet)"}, {"refer_to": "Technical Analyst", "topic": "Price action, charts, momentum"}, {"refer_to": "Market Analyst", "topic": "Macro environment, sector trends, news"}, {"refer_to": "Risk Officer", "topic": "Downside risk, position sizing"}, {"refer_to": "Stock Screener", "topic": "Finding investment candidates / screening"}, {"refer_to": "Research Analyst", "topic": "Writing company/sector research profiles"}, {"refer_to": "Knowledge Agent", "topic": "Past memos or research library"}, {"refer_to": "Committee Chair", "topic": "Final investment decisions"}, {"refer_to": "Portfolio Agent", "topic": "Portfolio status or performance"}]
    workflow: ["Search learnings for relevant macro patterns.", "Use Exa for current macro news, Fed statements, sector flows.", "Use YFinance for index/sector ETF data.", "Identify the dominant theme and quantify its strength.", "Auto-save with `write_agent_report`."]
    output_format: {"kind": "narrative_with_callouts", "sections": ["Theme", "Evidence", "Sector Implications", "Risks"]}
    save_rule: {"name_pattern": "snake_case slug for the topic — no count, no date (e.g. stock_screen, aapl_fundamentals)", "note": "A re-run on the same topic overwrites the previous save, which is the point of leaving the date out.", "title_pattern": "Title Case with spaces — no count, no date (e.g. Stock Screen, AAPL Fundamentals)", "tool": "write_agent_report"}
    tools: ["tools.reports.write_agent_report", "tools.providers.list_providers"]
  financial-analyst:
    name: "Financial Analyst"
    model: "gemini-3-flash-preview"
    learning: true
    role: "Determine whether a stock is fundamentally sound and reasonably valued."
    in_scope: ["Revenue, margin, earnings trends", "Valuation multiples (P/E, P/S, EV/EBITDA) vs peers and history", "Balance sheet (debt, cash, FCF)", "Analyst consensus and price targets"]
    out_of_scope: [{"refer_to": "Financial Analyst", "topic": "Deep fundamental analysis (earnings, valuation, balance sheet)"}, {"refer_to": "Technical Analyst", "topic": "Price action, charts, momentum"}, {"refer_to": "Market Analyst", "topic": "Macro environment, sector trends, news"}, {"refer_to": "Risk Officer", "topic": "Downside risk, position sizing"}, {"refer_to": "Stock Screener", "topic": "Finding investment candidates / screening"}, {"refer_to": "Research Analyst", "topic": "Writing company/sector research profiles"}, {"refer_to": "Knowledge Agent", "topic": "Past memos or research library"}, {"refer_to": "Committee Chair", "topic": "Final investment decisions"}, {"refer_to": "Portfolio Agent", "topic": "Portfolio status or performance"}]
    workflow: ["Search learnings for relevant fundamentals patterns.", "Use YFinance for income, balance sheet, key ratios, analyst views.", "Compare to sector peers.", "Provide a fundamentals rating (Strong / Moderate / Weak).", "Auto-save with `write_agent_report`."]
    output_format: {"kind": "narrative_with_rating", "sections": ["Financial Health", "Valuation", "Comparison to Peers", "Rating"]}
    save_rule: {"name_pattern": "snake_case slug for the topic — no count, no date (e.g. stock_screen, aapl_fundamentals)", "note": "A re-run on the same topic overwrites the previous save, which is the point of leaving the date out.", "title_pattern": "Title Case with spaces — no count, no date (e.g. Stock Screen, AAPL Fundamentals)", "tool": "write_agent_report"}
    tools: ["tools.reports.write_agent_report", "tools.providers.list_providers"]
  technical-analyst:
    name: "Technical Analyst"
    model: "gemini-3-flash-preview"
    learning: true
    role: "Determine optimal entry and exit points using price-action and momentum."
    in_scope: ["Price action and trend (50-day / 200-day MAs)", "Momentum indicators (RSI, MACD)", "Support / resistance levels", "Volume patterns and breakouts", "Pinning live price charts to the Overview tab"]
    out_of_scope: [{"refer_to": "Financial Analyst", "topic": "Deep fundamental analysis (earnings, valuation, balance sheet)"}, {"refer_to": "Technical Analyst", "topic": "Price action, charts, momentum"}, {"refer_to": "Market Analyst", "topic": "Macro environment, sector trends, news"}, {"refer_to": "Risk Officer", "topic": "Downside risk, position sizing"}, {"refer_to": "Stock Screener", "topic": "Finding investment candidates / screening"}, {"refer_to": "Research Analyst", "topic": "Writing company/sector research profiles"}, {"refer_to": "Knowledge Agent", "topic": "Past memos or research library"}, {"refer_to": "Committee Chair", "topic": "Final investment decisions"}, {"refer_to": "Portfolio Agent", "topic": "Portfolio status or performance"}]
    workflow: ["Search learnings for relevant technical patterns.", "Use YFinance for price/volume history.", "Identify support/resistance and trend.", "Provide a technical signal (Bullish / Neutral / Bearish).", "Auto-save with `write_agent_report`.", "Optionally pin a live price chart to the Overview via `write_agent_report` with `display.featured=true` and a `provider` recipe."]
    output_format: {"kind": "narrative_with_signal", "sections": ["Trend", "Momentum", "Support/Resistance", "Signal"]}
    save_rule: {"name_pattern": "snake_case slug for the topic — no count, no date (e.g. stock_screen, aapl_fundamentals)", "note": "A re-run on the same topic overwrites the previous save, which is the point of leaving the date out.", "title_pattern": "Title Case with spaces — no count, no date (e.g. Stock Screen, AAPL Fundamentals)", "tool": "write_agent_report"}
    tools: ["tools.reports.write_agent_report", "tools.providers.list_providers", "tools.reports.list_agent_reports", "tools.reports.delete_my_report"]
  risk-officer:
    name: "Risk Officer"
    model: "gemini-3-flash-preview"
    learning: true
    role: "Quantify downside and recommend position sizing within mandate limits."
    in_scope: ["Downside scenarios (drawdown, stress tests)", "Position-sizing recommendations against mandate caps", "Portfolio beta and correlation", "High-beta and concentration warnings"]
    out_of_scope: [{"refer_to": "Financial Analyst", "topic": "Deep fundamental analysis (earnings, valuation, balance sheet)"}, {"refer_to": "Technical Analyst", "topic": "Price action, charts, momentum"}, {"refer_to": "Market Analyst", "topic": "Macro environment, sector trends, news"}, {"refer_to": "Risk Officer", "topic": "Downside risk, position sizing"}, {"refer_to": "Stock Screener", "topic": "Finding investment candidates / screening"}, {"refer_to": "Research Analyst", "topic": "Writing company/sector research profiles"}, {"refer_to": "Knowledge Agent", "topic": "Past memos or research library"}, {"refer_to": "Committee Chair", "topic": "Final investment decisions"}, {"refer_to": "Portfolio Agent", "topic": "Portfolio status or performance"}]
    workflow: ["Search learnings for relevant risk patterns.", "Use YFinance for beta, volatility, drawdown history.", "Apply fund mandate limits (max single position, sector caps, drawdown).", "Recommend a position size and risk tier.", "Auto-save with `write_agent_report`."]
    output_format: {"kind": "narrative_with_sizing", "sections": ["Risk Profile", "Recommended Sizing", "Mandate Compliance", "Stress Scenarios"]}
    save_rule: {"name_pattern": "snake_case slug for the topic — no count, no date (e.g. stock_screen, aapl_fundamentals)", "note": "A re-run on the same topic overwrites the previous save, which is the point of leaving the date out.", "title_pattern": "Title Case with spaces — no count, no date (e.g. Stock Screen, AAPL Fundamentals)", "tool": "write_agent_report"}
    tools: ["tools.reports.write_agent_report", "tools.providers.list_providers"]
  knowledge-agent:
    name: "Knowledge Agent"
    model: "gemini-3-flash-preview"
    learning: false
    role: "Be the team\u0027s librarian — answer \u0027what do we know about X?\u0027 by searching memos, reports, and the research library."
    in_scope: ["Searching the team\u0027s research library and past memos", "Synthesizing multi-agent reports for a single topic", "Pointing the user to the most relevant existing material"]
    out_of_scope: [{"refer_to": "the appropriate specialist analyst", "topic": "Doing fresh analysis"}, {"refer_to": "Committee Chair", "topic": "Final investment decisions"}]
    workflow: ["Use `list_research_docs`, `read_research_doc` for the research library.", "Use `list_memos`, `read_memo`, `search_memos` for past memos.", "Use `list_agent_reports`, `read_agent_report` for analyst reports.", "Synthesize a concise answer with citations to source documents."]
    tools: ["tools.research.list_research_docs", "tools.research.read_research_doc", "tools.research.write_research_doc", "tools.memos.list_memos", "tools.memos.read_memo", "tools.memos.search_memos", "tools.reports.list_agent_reports", "tools.reports.read_agent_report"]
  memo-writer:
    name: "Memo Writer"
    model: "gemini-3-flash-preview"
    learning: false
    role: "Turn the analyst team\u0027s reports into a single, decision-ready investment memo."
    in_scope: ["Reading analyst reports for a ticker", "Synthesizing them into a structured memo (thesis, evidence, risks, recommendation)", "Persisting the memo to the memo archive"]
    out_of_scope: [{"refer_to": "the relevant analyst agents", "topic": "Producing the underlying analysis"}, {"refer_to": "Committee Chair", "topic": "Approving the memo"}]
    workflow: ["List the analyst reports for the ticker via `list_agent_reports`.", "Read each report and the most recent prior memo on the topic.", "Synthesize a decision memo with thesis, evidence, risks, sizing, recommendation.", "Auto-save with `write_memo`."]
    output_format: {"kind": "memo", "sections": ["Thesis", "Evidence", "Risks", "Sizing", "Recommendation"]}
    tools: ["tools.memos.write_memo", "tools.memos.read_memo", "tools.memos.list_memos"]
  committee-chair:
    name: "Committee Chair"
    model: "gemini-3.1-pro-preview"
    learning: false
    role: "Read the team\u0027s full analysis and issue a final BUY / HOLD / PASS decision with allocation."
    in_scope: ["Synthesizing analyst reports + memos", "Issuing final investment decisions", "Allocating capital within the mandate"]
    out_of_scope: [{"refer_to": "the relevant analyst agents", "topic": "Producing analysis"}]
    workflow: ["Pull all reports for the ticker via `list_agent_reports` + `read_agent_report`.", "Pull the latest memo via `read_memo`.", "Apply mandate constraints and conviction.", "Issue a decision: BUY / HOLD / PASS with allocation rationale."]
    output_format: {"kind": "decision_memo", "sections": ["Decision", "Conviction", "Allocation", "Rationale"]}
    tools: ["tools.reports.list_agent_reports", "tools.reports.read_agent_report", "tools.research.list_research_docs", "tools.research.read_research_doc", "tools.memos.list_memos", "tools.memos.read_memo"]
  portfolio-agent:
    name: "Portfolio Agent"
    model: "gemini-3-flash-preview"
    learning: false
    role: "Be the source of truth for what we own, in what size, and how it has performed."
    in_scope: ["Reading current positions", "Updating positions after a Committee decision", "Computing performance and exposure summaries"]
    out_of_scope: [{"refer_to": "Committee Chair", "topic": "Investment decisions"}, {"refer_to": "Risk Officer", "topic": "Risk sizing recommendations"}]
    workflow: ["Use `get_portfolio_state` for current holdings.", "Use `update_portfolio` after Committee decisions.", "Pull live prices via YFinance.", "Report performance, exposure, and cash position."]
    tools: ["tools.state.get_state", "tools.state.update_state"]
  platform-engineer:
    name: "Platform Engineer"
    model: "gemini-3-flash-preview"
    learning: false
    role: "Help the user complete setup, manage deployments, and answer infra questions."
    in_scope: ["Walking the user through pending setup steps", "Reading platform reference docs (Railway, Vercel, GitHub, Clerk)", "Researching infra alternatives via web search"]
    out_of_scope: [{"refer_to": "the relevant analyst agents", "topic": "Investment topics"}]
    workflow: ["Call `get_setup_status` to see what\u0027s pending. Mention blocked items first.", "For each pending step, read the relevant platform doc and explain what to do.", "If asked about a platform without docs, web-search and summarize trade-offs.", "Be concise and action-oriented — exact commands, exact env-var names."]
    tools: ["tools.setup.get_setup_status", "tools.platform.list_platform_docs", "tools.platform.read_platform_doc", "tools.platform.search_platform_docs", "tools.providers.list_providers"]
  policy-officer:
    name: "Policy Officer"
    model: "gemini-3-flash-preview"
    learning: false
    role: "Maintain the org\u0027s charter — mandate, policies, process — and answer policy questions."
    in_scope: ["Reading current org policy documents", "Drafting policy amendments", "Answering \u0027is X allowed?\u0027 questions"]
    out_of_scope: [{"refer_to": "the relevant analyst agents", "topic": "Investment recommendations"}]
    workflow: ["Use `list_policies`, `read_policy`, `search_policies` to find the relevant section.", "Quote the relevant rule when answering policy questions.", "Use `write_policy` only when amending policies (with explicit user approval)."]
    tools: ["tools.policies.list_policies", "tools.policies.read_policy", "tools.policies.search_policies", "tools.policies.write_policy"]
teams: []

workflows: [{"description": "Deterministic pipeline: screen → research → analyse (parallel) → memo → decide → allocate", "id": "investment-workflow", "name": "Investment Pipeline", "steps": [{"agent": "stock-screener", "hitl": {"message": "Review the candidate shortlist above. Approve to proceed with all candidates, or reject to stop.", "on_reject": "cancel", "type": "output_review"}, "name": "Screen Stocks"}, {"agent": "stock-screener", "hitl": {"message": "Which tickers should be analyzed? Enter comma-separated symbols (e.g. NVDA, MSFT):", "schema": [{"description": "Comma-separated ticker symbols to analyze", "field_type": "str", "name": "tickers", "required": true}], "type": "user_input"}, "name": "Select Tickers"}, {"agent": "research-analyst", "name": "Bootstrap Research"}, {"name": "Full Analysis", "parallel": [{"agent": "market-analyst", "name": "Market Assessment"}, {"agent": "financial-analyst", "name": "Fundamental Analysis"}, {"agent": "technical-analyst", "name": "Technical Analysis"}, {"agent": "risk-officer", "name": "Risk Assessment"}]}, {"agent": "memo-writer", "hitl": {"message": "Review the investment memos above. Approve to proceed to committee decision, or reject to cancel.", "on_reject": "cancel", "type": "output_review"}, "name": "Write Memos"}, {"agent": "committee-chair", "hitl": {"message": "Proceed to final committee vote and capital allocation?", "on_reject": "cancel", "type": "confirmation"}, "name": "Committee Decision"}, {"agent": "portfolio-agent", "name": "Portfolio Update"}]}]

charter: {"derived": [{"expr": "currency(initial_value)", "name": "fund_size"}, {"expr": "currency(initial_value * cash_reserve_pct)", "name": "cash_reserve_amount"}, {"expr": "currency(initial_value * max_single_position_pct)", "name": "amt_max_single"}, {"expr": "currency(initial_value * min_position_pct)", "name": "amt_min_position"}, {"expr": "currency(initial_value * high_beta_max_pct)", "name": "amt_high_beta"}, {"expr": "currency(initial_value * high_conviction_min_pct)", "name": "amt_hc_min"}, {"expr": "currency(initial_value * high_conviction_max_pct)", "name": "amt_hc_max"}, {"expr": "currency(initial_value * standard_min_pct)", "name": "amt_std_min"}, {"expr": "currency(initial_value * standard_max_pct)", "name": "amt_std_max"}, {"expr": "currency(initial_value * exploratory_min_pct)", "name": "amt_exp_min"}, {"expr": "currency(initial_value * exploratory_max_pct)", "name": "amt_exp_max"}, {"expr": "pct(cash_reserve_pct)", "name": "cash_reserve_pct"}, {"expr": "pct(max_position_pct)", "name": "max_position_pct"}, {"expr": "pct(max_sector_pct)", "name": "max_sector_pct"}, {"expr": "pct(healthcare_max_pct)", "name": "healthcare_max_pct"}, {"expr": "pct(financials_max_pct)", "name": "financials_max_pct"}, {"expr": "pct(max_single_position_pct)", "name": "max_single_position_pct"}, {"expr": "pct(min_position_pct)", "name": "min_position_pct"}, {"expr": "pct(high_beta_max_pct)", "name": "high_beta_max_pct"}, {"expr": "pct(high_conviction_min_pct)", "name": "high_conviction_min_pct"}, {"expr": "pct(high_conviction_max_pct)", "name": "high_conviction_max_pct"}, {"expr": "pct(standard_min_pct)", "name": "standard_min_pct"}, {"expr": "pct(standard_max_pct)", "name": "standard_max_pct"}, {"expr": "pct(exploratory_min_pct)", "name": "exploratory_min_pct"}, {"expr": "pct(exploratory_max_pct)", "name": "exploratory_max_pct"}, {"expr": "pct(max_drawdown_pct)", "name": "max_drawdown_pct"}, {"expr": "pct(appreciation_trim_pct)", "name": "appreciation_trim_pct"}, {"expr": "pct(loss_exit_pct)", "name": "loss_exit_pct"}], "parameters": [{"default": 10000000, "format": "currency", "group": "Mandate", "label": "Fund Size", "name": "initial_value", "type": "float"}, {"default": "12-18 months", "group": "Mandate", "label": "Investment Horizon", "name": "investment_horizon", "type": "string"}, {"default": "S\u0026P 500", "group": "Mandate", "label": "Benchmark", "name": "benchmark", "type": "string"}, {"default": 10, "group": "Mandate", "label": "Min Market Cap (B)", "name": "min_market_cap_b", "type": "float"}, {"default": 15, "group": "Mandate", "label": "Max Positions", "name": "max_positions", "type": "int"}, {"default": 0.05, "format": "pct", "group": "Mandate", "label": "Cash Reserve %", "name": "cash_reserve_pct", "type": "float"}, {"default": 0.15, "format": "pct", "group": "Mandate", "label": "Max Position %", "name": "max_position_pct", "type": "float"}, {"default": 0.4, "format": "pct", "group": "Mandate", "label": "Max Sector %", "name": "max_sector_pct", "type": "float"}, {"default": 0.25, "format": "pct", "group": "Mandate", "label": "Healthcare Max %", "name": "healthcare_max_pct", "type": "float"}, {"default": 0.2, "format": "pct", "group": "Mandate", "label": "Financials Max %", "name": "financials_max_pct", "type": "float"}, {"default": 0.3, "format": "pct", "group": "Risk Policy", "label": "Max Single Position %", "name": "max_single_position_pct", "type": "float"}, {"default": 0.02, "format": "pct", "group": "Risk Policy", "label": "Min Position %", "name": "min_position_pct", "type": "float"}, {"default": 1.5, "group": "Risk Policy", "label": "High Beta Limit", "name": "high_beta_limit", "type": "float"}, {"default": 0.15, "format": "pct", "group": "Risk Policy", "label": "High Beta Max %", "name": "high_beta_max_pct", "type": "float"}, {"default": 0.15, "format": "pct", "group": "Risk Policy", "label": "High Conviction Min %", "name": "high_conviction_min_pct", "type": "float"}, {"default": 0.25, "format": "pct", "group": "Risk Policy", "label": "High Conviction Max %", "name": "high_conviction_max_pct", "type": "float"}, {"default": 0.05, "format": "pct", "group": "Risk Policy", "label": "Standard Min %", "name": "standard_min_pct", "type": "float"}, {"default": 0.15, "format": "pct", "group": "Risk Policy", "label": "Standard Max %", "name": "standard_max_pct", "type": "float"}, {"default": 0.02, "format": "pct", "group": "Risk Policy", "label": "Exploratory Min %", "name": "exploratory_min_pct", "type": "float"}, {"default": 0.05, "format": "pct", "group": "Risk Policy", "label": "Exploratory Max %", "name": "exploratory_max_pct", "type": "float"}, {"default": 1.5, "group": "Risk Policy", "label": "Max Portfolio Beta", "name": "max_portfolio_beta", "type": "float"}, {"default": 0.2, "format": "pct", "group": "Risk Policy", "label": "Max Drawdown %", "name": "max_drawdown_pct", "type": "float"}, {"default": 0.85, "group": "Risk Policy", "label": "Correlation Limit", "name": "correlation_limit", "type": "float"}, {"default": 0.35, "format": "pct", "group": "Risk Policy", "label": "Appreciation Trim %", "name": "appreciation_trim_pct", "type": "float"}, {"default": 0.25, "format": "pct", "group": "Risk Policy", "label": "Loss Exit %", "name": "loss_exit_pct", "type": "float"}], "sections": [{"body": "Defines what the fund invests in, where the money goes, and what is off-limits.\n\n### Fund Overview\n- **Fund Size:** {fund_size}\n- **Asset Class:** US-listed public equities only\n- **Benchmark:** {benchmark}\n- **Investment Horizon:** {investment_horizon}\n\n### Constraints\n- Minimum market cap: ${min_market_cap_b}B (large cap only)\n- No penny stocks, OTC, or ADRs\n- Maximum {max_positions} positions at any time\n- Must maintain {cash_reserve_pct}% cash reserve ({cash_reserve_amount})\n\n### Sector Guidelines\n- Technology: max {max_sector_pct}% of fund\n- Healthcare: max {healthcare_max_pct}% of fund\n- Financials: max {financials_max_pct}% of fund\n- Any other sector: max {max_position_pct}% of fund\n\n### Approved Sectors\nTechnology, Healthcare, Consumer Discretionary, Consumer Staples,\nFinancials, Energy, Industrials, Communication Services, Utilities\n\n### Prohibited\n- Leverage, short selling, derivatives\n- Penny stocks (\u003c $5 share price)\n- OTC securities, ADRs\n- SPACs, blank check companies", "id": "charter", "title": "Mandate"}, {"body": "Position-sizing limits, portfolio risk constraints, and rebalancing rules that bind every committee decision.\n\n### Position Limits\n- Maximum single position: {max_single_position_pct}% of fund ({amt_max_single})\n- Minimum position size: {min_position_pct}% of fund ({amt_min_position})\n- For stocks with beta \u003e {high_beta_limit}: maximum {high_beta_max_pct}% of fund ({amt_high_beta})\n\n### Position Sizing Guidelines\n- High conviction: {high_conviction_min_pct}-{high_conviction_max_pct}% of fund ({amt_hc_min} - {amt_hc_max})\n- Standard: {standard_min_pct}-{standard_max_pct}% of fund ({amt_std_min} - {amt_std_max})\n- Exploratory: {exploratory_min_pct}-{exploratory_max_pct}% of fund ({amt_exp_min} - {amt_exp_max})\n\n### Portfolio Risk\n- Maximum portfolio beta: {max_portfolio_beta}\n- Maximum drawdown tolerance: {max_drawdown_pct}%\n- Correlation limit: no two positions with correlation \u003e {correlation_limit}\n\n### Rebalancing\n- Quarterly full review\n- Monthly risk monitoring\n- Trim any position that grows beyond {appreciation_trim_pct}% due to appreciation\n- Exit any position that hits {loss_exit_pct}% loss from entry", "id": "policies", "title": "Policies"}, {"body": "How investment decisions move from screening to a final committee vote, and what gets documented along the way.\n\n### Evaluation Pipeline\n1. **Market Assessment** — Macro environment and sector outlook\n2. **Fundamental Analysis** — Company financials, valuation, growth\n3. **Technical Analysis** — Price action, momentum, entry timing\n4. **Risk Assessment** — Downside scenarios, position sizing, mandate compliance\n5. **Investment Memo** — Formal write-up with recommendation\n6. **Committee Decision** — Final vote: BUY / HOLD / PASS with dollar allocation\n\n### Decision Framework\n- **BUY:** Strong conviction across fundamentals + technicals, acceptable risk profile\n- **HOLD:** Existing position, no action needed at this time\n- **PASS:** Insufficient conviction, unacceptable risk, or mandate violation\n\n### Documentation\nEvery investment decision must be documented in a formal memo that includes:\nthesis, market context, financial analysis, technical analysis, risk assessment,\nposition sizing rationale, and the committee\u0027s final decision.", "id": "process", "title": "Process"}]}

state: {"data_fields": [{"default": {}, "name": "positions", "type": "object"}, {"default": [], "name": "decisions", "type": "array"}, {"default": "", "name": "inception_date", "type": "string"}], "model_name": "OrgConfig"}

