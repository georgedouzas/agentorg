site_name: "org"
site_description: "Small research team that gathers source material, synthesises findings, and publishes structured analysis reports."
repo_url: "https://github.com/example/org"
repo_name: "example/org"
site_dir: "site"
watch: [README.md, CHANGELOG.md]

theme:
  name: material
  features:
  - navigation.top
  palette:
    primary: blue

nav:
  - Overview:
    - index.md
    - User guide: overview/user_guide.md
    - Changelog: overview/changelog.md
  - API: api/
  - Examples: generated/gallery
  - Development:
    - development/index.md
    - Contributing: development/contributing.md
extra_css:
  - css/style.css
  - css/material.css
  - css/mkdocstrings.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
