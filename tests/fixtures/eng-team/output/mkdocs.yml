site_name: "eng-team"
site_description: "Multi-agent system simulating a professional software engineering team that plans, builds, reviews, and ships production code."
repo_url: "https://github.com/georgedouzas/eng-team"
repo_name: "georgedouzas/eng-team"
site_dir: "site"
watch: [README.md, CHANGELOG.md]

theme:
  name: material
  features:
  - navigation.top
  palette:
    primary: blue

nav:
  - Overview:
    - index.md
    - User guide: overview/user_guide.md
    - Changelog: overview/changelog.md
  - API: api/
  - Examples: generated/gallery
  - Development:
    - development/index.md
    - Contributing: development/contributing.md
extra_css:
  - css/style.css
  - css/material.css
  - css/mkdocstrings.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
