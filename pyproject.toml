[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "agentorg"
description = "A framework for generating multi-agent organisations powered by Claude agents."
authors = [{name = "Georgios Douzas", email = "gdouzas@icloud.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11, <3.14"
keywords = []
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "agentfield>=0.1.84",
    "fastapi>=0.115",
    "mcp>=1.28.1,<2",
    "httpx>=0.27",
    "claude-agent-sdk>=0.2.180",
    "croniter>=7.0.0",
    "aio-pika>=10.2.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "jsonschema>=4.26.0",
    "rich>=15.0.0",
    "litellm>=1.109.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://georgedouzas.github.io/agentorg"
Documentation = "https://georgedouzas.github.io/agentorg"
Changelog = "https://georgedouzas.github.io/agentorg/changelog"
Repository = "https://github.com/georgedouzas/agentorg"
Issues = "https://github.com/georgedouzas/agentorg/issues"
Discussions = "https://github.com/georgedouzas/agentorg/discussions"
Funding = "https://github.com/sponsors/georgedouzas"

[dependency-groups]
dev = [
    "properdocs>=1.6.7",
    "mkdocs-coverage>=1.1.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-material>=9.5.27",
    "mkdocs-gallery>=0.10.1",
    "mkdocs-section-index>=0.3.9",
    "mkdocstrings[python]>=0.25.1",
    "markdown-callouts>=0.4.0",
    "markdown-exec>=1.9.3",
    "pandas>=2.2.2",
    "black>=24.4.2",
    "docformatter>=1.7.5",
    "ruff>=0.5.0",
    "pip-audit>=2.7.3",
    "bandit[toml]>=1.7.5",
    "mypy>=1.10.1",
    "types-markdown>=3.6.0.20240316",
    "types-toml>=0.10.8.20240310",
    "interrogate>=1.7.0",
    "pydoclint>=0.9.1",
    "deptry>=0.25.1",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=3.15.0",
    "pytest-xdist>=3.6.1",
    "git-changelog>=2.5.2",
    "twine>=5.1.1",
    "nox[uv]>=2024.4.15",
    "pytest-asyncio>=0.23.0",
    "testcontainers[rabbitmq]>=4.0.0",
    "types-requests>=2.33.0.20260518",
    "types-croniter>=6.2.4.20261006",
    "types-jsonschema>=4.26.0.20261006",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261113",
]
e2e = [
    "playwright>=1.65.1",
]

[project.scripts]
agentorg = "agentorg.cli:main"
agentorg-mcp = "agentorg.core.adapters.mcp:run"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/agentorg"]

[tool.black]
line-length = 120
extend-exclude = "(tests/fixtures|docs/generated)"
skip-string-normalization = true
target-version = ["py311"]

[tool.docformatter]
black = true
in-place = true
recursive = true
close-quotes-on-newline = true
wrap-descriptions = 120
wrap-summaries = 120
exclude = [
    "tests/fixtures",
    # Files where black wants 2 blank lines after module docstring / function-with-only-a-docstring,
    # and docformatter wants 1: the formatters oscillate. Excluding from docformatter lets black win.
    "_agent.py",
    "test_parameters.py",
]

[tool.ruff]
extend-exclude = ["docs/generated", "tests/fixtures"]
force-exclude = true
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["D202", "N806", "N803", "S101", "INP001", "Q000", "TRY002", "PLR0913", "EXE001", "EXE002", "E741"]
select = ["C", "E", "F", "W", "B", "I", "D", "N", "UP", "YTT", "ANN", "S",
"BLE", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G",
"INP", "PIE", "T20", "PT", "Q", "RET501", "RET502", "RET503", "SIM",
"PTH", "PD", "PGH", "PL", "TRY", "RUF", "PLE", "PLR", "PLW", "TRY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"docs/examples/*" = ["ANN", "D", "B018"]
"docs/generated/*" = ["ANN", "D"]
"test_*" = ["ANN", "PLR2004"]
"conftest.py" = ["PLR0917"]
"src/agentorg/master/_sandbox.py" = ["S603"]
"tests/e2e/harness/*" = ["S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_missing_imports = true
exclude = ["tests/fixtures/", "docs/examples/", "docs/generated/", "src/agentorg/core/render/templates/"]
warn_unused_ignores = true
show_error_codes = true

[tool.deptry.per_rule_ignores]
# SQLAlchemy loads the database drivers from the URL, so they are never imported directly.
DEP002 = ["aiosqlite", "asyncpg"]

[tool.interrogate]
# pydoclint documents constructor arguments on the class, so `__init__` stays without a docstring.
ignore-init-method = true
ignore-nested-functions = true
fail-under = 80

[tool.pydoclint]
# Verifies docstrings match the signature, which interrogate cannot: interrogate counts
# docstrings, this one reads them.
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false

[tool.bandit]
# Read by the checks nox session, which passes `-c pyproject.toml`. B101 is the
# bandit counterpart of the ruff S101 ignore above: asserts are how tests assert.
skips = ["B101"]

[tool.pip-audit]
# Advisory IDs to ignore, read by the checks nox session. PYSEC-2022-42969 is a
# won't-fix ReDoS in py, pulled in transitively by interrogate.
ignore-vulns = ["PYSEC-2022-42969"]

[tool.agentorg.test-layout]
# Modules without a mirrored test file, read by `agentorg check-layout`. `_config` holds only a base class.
exempt = ["src/agentorg/core/spec/_config.py"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "--cov"
testpaths = ["tests"]
# The e2e suite runs only through `nox -s e2e`.
norecursedirs = ["tests/fixtures", "e2e"]
asyncio_mode = "auto"
markers = ["network: test clones from public git remotes; deselect with -m 'not network'"]

[tool.coverage.run]
branch = true
parallel = true
source = ["src", "tests"]
omit = ["tests/e2e/*"]

[tool.coverage.paths]
equivalent = ["src", "__pypackages__"]

[tool.coverage.report]
precision = 2
omit = ["src/*/__init__.py", "tests/__init__.py"]

[tool.coverage.json]
output = "htmlcov/coverage.json"
