schema: spec-driven

context: |
  CLAUDE.md is the authority on architecture, package discipline, module structure and code style; designs and tasks must follow it
  Keep the three core layers separate: spec/ (Pydantic models), render/ (Jinja materialisation), tools/ (runtime helpers shipped to rendered orgs)
  agentorg never imports agno; runnables are plain async callables or objects with .arun()
  Rendered orgs delegate memory, identity, audit and policies to AgentField; do not reimplement them
  Master-agent stages get narrow tool slices; a change must not give a stage tools that belong to another stage
  Renderer writes must stay idempotent so the live preview's Vite watcher does not fire on no-op rerenders

rules:
  proposal:
    - State what is out of scope
  tasks:
    - End with verification tasks running `uv run nox -s formatting`, `uv run nox -s checks` and `uv run nox -s tests`
    - When a change touches render/templates, include running tests/core/render/test_base.py::test_each_shipped_template_renders
    - New public names need tests under tests/ mirroring the source path

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
